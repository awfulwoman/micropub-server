{% extends "ui/layout.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<p>{{ question }}</p>
<div class="preview"><strong>{{ title }}</strong><br><small>{{ subject }}</small>{% if note %}<br><small class="error">{{ note }}</small>{% endif %}</div>
<form method="post" action="{{ action }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="actions">
    <button class="primary {{ 'danger' if danger }}" type="submit">{{ button }}</button>
    <a class="button" href="{{ cancel_url }}">Cancel</a>
  </div>
</form>
{% endblock %}
