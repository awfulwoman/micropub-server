{% extends "base.html" %}
{% block content %}
<h1>{{ app_name }}</h1>
<p>A Micropub and IndieAuth server for <a href="{{ me }}">{{ me }}</a>.</p>
<p><a class="button primary" href="/login">Sign in</a></p>
<h2>Endpoints</h2>
<dl class="props">
  <dt>Micropub</dt><dd><code>{{ base }}micropub</code></dd>
  <dt>Media</dt><dd><code>{{ base }}media</code></dd>
  <dt>Authorization</dt><dd><code>{{ base }}auth</code></dd>
  <dt>Token</dt><dd><code>{{ base }}auth/token</code></dd>
</dl>
{% endblock %}
