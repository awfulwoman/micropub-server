[project]
name = "micropub-server"
version = "0.1.0"
description = "Micropub and IndieAuth server that publishes to a Hugo site via Git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "ruamel.yaml>=0.18",
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "markdown-it-py>=3.0",
    "markdownify>=0.13",
    "python-slugify>=8.0",
    "mf2py>=2.0",
    "uuid-utils>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
micropub-server = "micropub_server.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length; long string literals are fine

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micropub_server"]
