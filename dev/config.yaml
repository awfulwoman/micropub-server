# Development config: posts are written to ./dev/site instead of GitHub.
# The post_types here mirror awfulwoman.com; in production they come from the
# site's own data/micropub.yaml (spec 06), with this as the fallback.
application:
  time_zone: Europe/Berlin

store:
  type: filesystem
  directory: /site

channels:
  main: {name: Main}
  pages: {name: Pages}

post_types:
  note:
    name: Note
    post:
      path: content/notes/{yyyy}/{MM}/{dd}/{slug}.md
      url: notes/{yyyy}/{MM}/{dd}/{slug}/
    properties: [content, category, location, photo]
    required_properties: [content]
  article:
    name: Post
    import_slug: title  # Hugo's /posts/:slug/ permalink falls back to the title
    post:
      path: content/posts/{yyyy}/{MM}/{dd}/{slug}/index.md
      url: posts/{slug}/
      aliases:
        - /posts/{yyyy}/{MM}/{dd}/{slug}/
    properties: [name, content, summary, category, photo]
    required_properties: [name, content]
  bookmark:
    name: Bookmark
    discovery: bookmark-of
    post:
      path: content/bookmarks/{yyyy}/{MM}/{dd}/{slug}.md
      url: bookmarks/{yyyy}/{MM}/{dd}/{slug}/
    properties: [bookmark-of, name, content, category]
    required_properties: [bookmark-of]
  like:
    name: Like
    post:
      path: content/likes/{yyyy}/{MM}/{dd}/{slug}.md
      url: likes/{yyyy}/{MM}/{dd}/{slug}/
    properties: [like-of]
    required_properties: [like-of]
  reply:
    name: Reply
    post:
      path: content/replies/{yyyy}/{MM}/{dd}/{slug}.md
      url: replies/{yyyy}/{MM}/{dd}/{slug}/
    properties: [in-reply-to, content]
    required_properties: [in-reply-to]
  repost:
    name: Repost
    post:
      path: content/reposts/{yyyy}/{MM}/{dd}/{slug}.md
      url: reposts/{yyyy}/{MM}/{dd}/{slug}/
    properties: [repost-of, content]
    required_properties: [repost-of]
  quote:
    name: Quote
    discovery: quotation-of
    post:
      path: content/quotes/{yyyy}/{MM}/{dd}/{slug}.md
      url: quotes/{yyyy}/{MM}/{dd}/{slug}/
    properties: [quotation-of, content]
    required_properties: [quotation-of, content]
  photo:
    name: Photo
    post:
      path: content/photos/{yyyy}/{MM}/{dd}/{slug}/index.md
      url: photos/{yyyy}/{MM}/{dd}/{slug}/
    properties: [photo, name, content, category, location]
    required_properties: [photo]
  checkin:
    name: Checkin
    discovery: checkin
    discovery_first: true
    post:
      path: content/checkins/{yyyy}/{MM}/{dd}/{slug}/index.md
      url: checkins/{yyyy}/{MM}/{dd}/{slug}/
    properties: [checkin, content, photo, category]
    required_properties: [checkin]
  page:
    name: Page
    channel: pages
    post:
      path: content/{slug}.md
      url: "{slug}/"
    properties: [name, content]
    required_properties: [name, content]
